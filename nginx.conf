# 后端 upstream：keepalive 复用 TCP 连接，避免每次请求都重新握手
upstream folio_backend {
    server backend:5000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # 客户端最大上传大小（与 Flask MAX_CONTENT_LENGTH=16MB 保持一致，防止 Nginx 缓冲超限请求耗尽内存）
    client_max_body_size 16M;
    # 增加客户端超时（优化大文件上传）
    client_body_timeout 300s;
    client_header_timeout 300s;

    # 开启 gzip 压缩（大幅提升传输速度）
    gzip on;
    gzip_vary on;
    gzip_proxied any;        # ← 关键：压缩来自后端的代理响应（API JSON）
    gzip_min_length 256;     # ← 降低阈值，小 JSON 也压缩
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript font/woff2 image/svg+xml;
    gzip_comp_level 5;       # ← 从 6 降到 5，CPU 占用减少，压缩率差异极小

    # ES Module 文件 (.mjs)：Nginx 默认 mime.types 不含此类型，必须显式声明
    # 否则浏览器会拒绝加载（Strict MIME checking for module scripts）
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全响应头（适用于所有响应）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：允许同源脚本/样式，允许 inline styles（Element Plus 需要），禁止嵌入第三方 frame
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML文件不缓存（方便开发调试）
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 缓存静态资源（含 .mjs 前端模块）
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API 代理（优化后端通信）
    location /api/ {
        proxy_pass http://folio_backend;  # ← 使用 upstream，复用长连接

        # 优化代理性能：增大缓冲区，典型 API 响应 10-50KB，避免写临时文件
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;

        # 增加超时时间
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 头部设置（包含 Cookie 传递）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";

        # 启用 HTTP/1.1 保持连接
        proxy_http_version 1.1;

        # CORS 由后端 Flask-CORS 处理，nginx 不重复设置
    }

    # 上传文件访问
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 1y;
        add_header Cache-Control "public";
        # 开启 sendfile 优化文件传输
        sendfile on;
        tcp_nopush on;
    }

    # 健康检查
    location /health {
        proxy_pass http://folio_backend/health;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
