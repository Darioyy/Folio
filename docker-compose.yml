services:
  # MySQL 数据库（低配服务器优化版）
  mysql:
    image: mysql:8.0
    container_name: folio_mysql
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - folio_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql.cnf:/etc/mysql/conf.d/custom.cnf
    # 低配服务器优化命令
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=100
      - --table_open_cache=200
      - --innodb_buffer_pool_size=128M
      - --innodb_log_file_size=32M
      - --key_buffer_size=16M
      - --sort_buffer_size=2M
      - --read_buffer_size=1M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      # 使用 MYSQL_PWD 环境变量传递密码，避免密码出现在 docker inspect 的命令行参数中
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Flask 后端（低配服务器优化版）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: folio_backend
    restart: always
    # 不暴露 5000 端口到宿主机，由 nginx 内部代理
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=${FLASK_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s

  # Nginx 前端
  nginx:
    image: nginx:alpine
    container_name: folio_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      # 挂载编译后的静态文件（需先执行 cd frontend && npm run build）
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./uploads:/usr/share/nginx/uploads
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  folio_mysql_data:
    driver: local
