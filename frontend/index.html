<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Folio - 私有云存储 + 内容分享社区" />
    <title>Folio</title>
    <!-- 字体：DM Sans（标题）+ JetBrains Mono（代码）-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- 暗黑模式预初始化：在任何 CSS/JS 加载前同步设置背景色，消除白屏闪烁 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dark_mode')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'true' || (stored === null && prefersDark)
          if (isDark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <!-- 关键背景色：在外部 CSS 加载前保证底色正确，防止快速刷新出现黑条/白条 -->
    <style>
      html { background-color: #f8f9fb; }
      html.dark { background-color: #141720; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
