<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a67d8"/>
      <stop offset="100%" stop-color="#6d4cdf"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- F mark: vertical stroke -->
  <rect x="9" y="9" width="3" height="14" rx="1.4" fill="white"/>
  <!-- F mark: top horizontal -->
  <rect x="9" y="9" width="13" height="3" rx="1.4" fill="white"/>
  <!-- F mark: mid horizontal (shorter) -->
  <rect x="10.5" y="16.5" width="9" height="2.6" rx="1.3" fill="rgba(255,255,255,0.88)"/>
</svg>
